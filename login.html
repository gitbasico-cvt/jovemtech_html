<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: Arial; margin: 50px; background: #f0f8ff; }
    h1 { color: #004080; }
    label { display: block; margin-top: 15px; }
    input { padding: 5px; width: 250px; }
    button { margin-top: 20px; padding: 10px 15px; background-color: #004080; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background-color: #00264d; }
    #out { margin-top: 20px; color: red; white-space: pre-wrap; }
    a { display: block; margin-top: 15px; color: #004080; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<h1>Login</h1>

<label>Login:</label>
<input type="text" id="login">

<label>Senha:</label>
<input type="password" id="senha">

<button id="btnLogin">Entrar</button>

<pre id="out"></pre>

<a href="inserirLogin.html">Não tenho Cadastro?</a>

<script>
document.getElementById("btnLogin").onclick = async () => {
  const login = document.getElementById("login").value.trim();
  const senha = document.getElementById("senha").value;
  const out = document.getElementById("out");
  out.textContent = "";

  if (!login || !senha) {
    out.textContent = "Preencha login e senha.";
    return;
  }

  try {
    const res = await fetch("https://jovemtech.criesites.shop/api/login.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login, senha })
    });

    const data = await res.json();

    if (!data.ok) {
      out.textContent = "Erro: " + data.error;
      return;
    }

    out.textContent = `✅ ${data.message}\nBem-vindo, ${data.user.login} (${data.user.perfil})`;

    // Aqui você pode redirecionar para outra página
     window.location.href = "consultaLogin.html";

  } catch (err) {
    out.textContent = "Falha na requisição: " + err.message;
  }
};
</script>

</body>
</html>
