<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Listar Usuários</title>
  
</head>
<body>

  <h1>Listar Usuários</h1>
  <button id="btn">Consultar</button>

  <table id="tabela"></table>
  <pre id="out"></pre>

  <script>
    document.getElementById("btn").onclick = async () => {
      const tabela = document.getElementById("tabela");
      const out = document.getElementById("out");
      out.textContent = "";
      tabela.innerHTML = "";

      try {
        const res = await fetch("https://jovemtech.criesites.shop/api/consultaLogin.php");
        const data = await res.json();

        if (!data.ok) {
          out.textContent = "Erro: " + data.error;
          return;
        }

        if (data.data.length === 0) {
          out.textContent = "Nenhum usuário encontrado.";
          return;
        }

        // Cabeçalho da tabela
        tabela.innerHTML = `
          <tr>
            <th>ID</th>
            <th>Login</th>
            <th>Perfil</th>
            <th>Senha</th>
            <th>Criado em</th>
          </tr>
        `;

        // Preenche os dados
        data.data.forEach(u => {
          tabela.innerHTML += `
            <tr>
              <td>${u.idLogin}</td>
              <td>${u.login}</td>
              <td>${u.perfil}</td>
              <td>${u.senha}</td>
              <td>${u.data_cadastro}</td>
            </tr>
          `;
        });

      } catch (err) {
        out.textContent = "Falha na requisição: " + err.message;
      }
    };
  </script>

</body>
</html>
